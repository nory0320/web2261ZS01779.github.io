<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東公園のネコたち</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>東公園のネコたち</h1>
        <p>福岡・東公園で出会ったネコたちを紹介します。</p>
    </header>

    <main>

        <section class="introduction">
            <h2>東公園について</h2>
            <p>
                東公園は福岡市にある緑豊かな公園です。
                公園を歩いていると、さまざまなネコに出会うことがあります。
                このページでは、東公園で見かけたネコたちを紹介します。
            </p>
        </section>

        <section>
            <h2>東公園のネコ</h2>

            <div class="cats">

                <div class="cat-card">
                    <img src="cat1.jpg" alt="東公園で見かけたネコ">
                    <h3>ネコ①</h3>
                    <p>公園でのんびり過ごしていました。</p>
                </div>

                <div class="cat-card">
                    <img src="cat2.jpg" alt="東公園で見かけたネコ">
                    <h3>ネコ②</h3>
                    <p>あいさつしてるところを見つけました。</p>
                </div>

                <div class="cat-card">
                    <img src="cat3.jpg" alt="東公園で見かけたネコ">
                    <h3>ネコ③</h3>
                    <p>何かをじっと見ていました。</p>
                </div>

            </div>
        </section>

        <section class="button-area">
            <h2>今日のネコ情報</h2>

            <p id="cat-message">
                ボタンを押してみてください。
            </p>

            <button onclick="showCatMessage()">
                ネコ情報を見る
            </button>
        </section>

    </main>

    <footer>
        <p>東公園のネコたち</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
